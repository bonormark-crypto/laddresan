name: Kontrollera NOBIL-data

on:
  workflow_dispatch:   # körs för hand: Actions → Kontrollera NOBIL-data → Run workflow

permissions:
  contents: write   # sparar sammanställningen på grenen nobil-rapport

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mät hårdvarudata i NOBIL
        env:
          NOBIL_API_KEY: ${{ secrets.NOBIL_API_KEY }}
        run: python scripts/nobil_check.py --out rapport.md --json nobil_se_dc.json

      - name: Visa rapporten
        run: cat rapport.md >> "$GITHUB_STEP_SUMMARY"

      - name: Spara sammanställningen på grenen nobil-rapport
        run: |
          cp rapport.md /tmp/rapport.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan nobil-rapport
          git rm -rfq .
          cp /tmp/rapport.md rapport.md
          git add rapport.md
          git commit -qm "NOBIL-rapport $(date -u +%F)"
          git push -fq origin nobil-rapport

      - uses: actions/upload-artifact@v4
        with:
          name: nobil-rapport
          path: |
            rapport.md
            nobil_se_dc.json
          retention-days: 14
